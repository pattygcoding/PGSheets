name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repository pins only a floor (rust-version in Cargo.toml); the toolchain actually tested
      # against is pinned here, which is what keeps a local `stable` honest.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # `cargo fmt --check` and clippy with `-D warnings` are this repository's "warnings must stay at
      # zero" rule: `[workspace.lints]` denies the unused group, so a warning fails the build.
      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release --locked

      - name: Test
        run: cargo test --workspace --locked

      # One platform is enough for coverage; the test run above is what has to pass everywhere.
      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust/lcov.info
          if-no-files-found: error

